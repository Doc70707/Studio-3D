[package]
name = "studio3d"
version = "0.32.0"
description = "Studio 3D: beginner-first 3D design for printing"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "studio3d_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
